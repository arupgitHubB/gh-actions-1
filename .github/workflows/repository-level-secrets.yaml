# We can go to Github repo settings -> Secrets and Variables -> Click on New Repository Secrets/Variables to create one and use
# them the below way in the workflow

# for secrets: ${{ secrets.DOCKER_PASSWORD }}
# for variables: ${{ vars.DOCKER_USERNAME }}

####################################################

name: Repository level secrets
env:                                                            # This is on workflow level
  CONTAINER_REGISTRY: docker.io

on: push
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker build
        run: echo docker build -t ${{ env.CONTAINER_REGISTRY }}/${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE }}:latest

      - name: Docker login
        run: echo docker login --username=$DOCKER_USERNAME --password=${{ secrets.DOCKER_PASSWORD }}

      - name: Docker publish
        run: echo docker push ${{ env.CONTAINER_REGISTRY }}/{{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE }}:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the image in Docker
        run: echo docker run -d -p 8080:80 ${{ env.CONTAINER_REGISTRY }}/{{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_IMAGE }}:latest